<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma Festivalazo</title>
<meta name="description" content="Cronograma del Festivalazo · 9na edición">
<meta name="theme-color" content="#7d7f78">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Questrial&family=League+Spartan:wght@600;700;800&family=Special+Elite&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --amarillo:#ffc000; --crema:#f6dfc0; --texto:#121212;
  --inicial:#5e7b07; --intermedio:#f39200; --avanzado:#dd2400; --atp:#cd87ae; --general:#fbd8b4;
  --gris:#d3d4cf; --borde:#111;
  --fondo:url(img/dias/fondo-viernes.jpg);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#7d7f78;color:#fff;font-family:Questrial,system-ui,sans-serif;font-size:16px;line-height:1.25;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
body::before{content:"";position:fixed;inset:-60px;z-index:-2;background:var(--fondo) center/cover no-repeat;filter:blur(22px) saturate(1.1);transition:background-image .4s}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.08) 40%,rgba(0,0,0,.25))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.sombra{text-shadow:0 2px 6px rgba(0,0,0,.35)}

/* encabezado */
.colgante{display:block;width:100%;height:150px;object-fit:cover;object-position:right top;
  -webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent),linear-gradient(to right,transparent,#000 25%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 55%,transparent),linear-gradient(to right,transparent,#000 25%);mask-composite:intersect}
header{margin-top:-62px;position:relative;text-align:center;padding-bottom:10px}
h1{font-weight:400}
h1 .c{display:block;font-family:Questrial,sans-serif;font-size:min(11.5vw,60px);letter-spacing:0;line-height:1;color:#fff}
.sub{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:2px}
.sub img{width:96px;height:57px;object-fit:cover;-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent)}
.sub .f{display:block;font-family:"Special Elite",monospace;font-size:30px;color:var(--crema);line-height:1}
.sub .e{display:block;font-family:Caveat,cursive;font-size:22px;color:#fff;line-height:1;margin-top:2px}

/* avisos */
#avisos:empty{display:none}
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--amarillo);color:var(--texto);border:2px solid var(--borde);padding:12px 14px;margin-bottom:10px;font-family:"League Spartan",sans-serif;font-weight:700;font-size:17px}
.aviso .ico{font-size:20px;line-height:1}
.aviso small{display:block;font-family:Questrial,sans-serif;font-weight:400;font-size:13px;margin-top:2px}

/* ahora / sigue */
#ahora{margin:8px 0 18px}
.etq{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin:0 0 6px;font-size:15px}
.etq b{font-family:"League Spartan",sans-serif;font-weight:800;letter-spacing:2px;color:var(--amarillo);display:inline-flex;align-items:center;gap:8px}
.punto{width:10px;height:10px;border-radius:50%;background:var(--avanzado);box-shadow:0 0 0 2px #fff;animation:late 1.4s infinite}
@keyframes late{50%{opacity:.3}}
.queda{font-size:14px;margin-top:6px}
.barra{height:5px;background:rgba(255,255,255,.35);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--amarillo)}
.bloque-sig{margin-top:16px}
.mensaje{background:rgba(255,255,255,.18);border:2px solid var(--borde);padding:18px 14px;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mensaje .grande{font-family:Questrial,sans-serif;font-size:32px;color:var(--amarillo)}
.mensaje p{margin-top:4px}

/* pestañas de días */
.dias{position:sticky;top:0;z-index:5;padding:10px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dias::before{content:"";position:absolute;inset:0 -16px;z-index:-1;background:rgba(90,92,86,.55);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.dias button{padding:6px 2px;text-align:center;border:2px solid transparent;background:rgba(0,0,0,.18)}
.dias button b{display:block;font-family:Questrial,sans-serif;font-weight:400;font-size:19px;color:var(--amarillo);letter-spacing:.5px}
.dias button span{display:block;font-size:12px}
.dias button[aria-selected=true]{background:var(--amarillo);border-color:var(--borde)}
.dias button[aria-selected=true] b,.dias button[aria-selected=true] span{color:var(--texto)}
.dias .hoy{font-family:"League Spartan",sans-serif;font-weight:800;font-size:10px;letter-spacing:1px}

/* título del día */
.titulo-dia{display:flex;align-items:baseline;gap:12px;margin:14px 0 12px}
.titulo-dia b{font-family:Questrial,sans-serif;font-weight:400;font-size:min(16vw,72px);line-height:1;color:var(--amarillo);text-shadow:0 3px 8px rgba(0,0,0,.35)}
.titulo-dia span{font-size:26px}

/* tabla */
.tabla{border:2px solid var(--borde);background:var(--borde);display:grid;gap:2px;text-shadow:none}
.fila{display:grid;grid-template-columns:62px 1fr;gap:2px}
.hora{background:var(--amarillo);color:var(--texto);font-family:"League Spartan",sans-serif;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 2px;line-height:1.1}
.hora small{font-weight:600;font-size:12px}
.celdas{display:grid;gap:2px;grid-template-columns:repeat(var(--cols,1),1fr)}
.celda{background:var(--n,var(--general));color:var(--texto);padding:12px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:64px}
.celda:last-child:nth-child(odd){grid-column:1/-1}
.celdas[style*="--cols:3"] .celda:last-child:nth-child(odd){grid-column:auto}
.celda .t{font-family:"League Spartan",sans-serif;font-weight:700;font-size:17px;line-height:1.15}
.celda .d{font-size:14px;margin-top:2px}
.celda .p{font-style:italic;font-size:15px;margin-top:3px}
.celda.gris{background:var(--gris);min-height:48px}
.celda.gris .t{font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.3px;font-size:16px}
.celda.gris .d,.celda.gris .p{font-style:italic}
.fila.pasada .celda,.fila.pasada .hora{filter:grayscale(.75) brightness(1.12) contrast(.8)}
.fila.en-curso .hora{background:#fff}
.fila.en-curso .hora::after{content:"AHORA";margin-top:4px;font-size:9px;letter-spacing:1px;background:var(--avanzado);color:#fff;padding:2px 4px}

/* leyenda */
.leyenda{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;max-width:320px;margin:18px auto 0;font-size:16px}
.leyenda span{display:flex;align-items:center;gap:10px;letter-spacing:.5px}
.leyenda i{width:24px;height:24px;border-radius:50%;background:var(--n);flex:none}

footer{position:relative;text-align:center;padding:24px 0 34px;font-size:14px}
footer a{font-weight:700;text-decoration:underline}
footer p + p{margin-top:8px}
.estado{font-size:12px;opacity:.85}
</style>
</head>
<body>
<img class="colgante" src="img/colgante.jpg" alt="">
<div class="wrap">
  <header class="sombra">
    <h1><span class="c">CRONOGRAMA</span></h1>
    <div class="sub">
      <img src="img/margaritas.jpg" alt="">
      <div><span class="f">festivalazo</span><span class="e">9na edición</span></div>
    </div>
  </header>

  <div id="avisos" aria-live="polite"></div>
  <section id="ahora" class="sombra" aria-live="polite"></section>

  <nav class="dias" id="dias" role="tablist"></nav>
  <section id="dia"></section>

  <div class="leyenda sombra">
    <span><i style="--n:var(--inicial)"></i>INICIAL</span>
    <span><i style="--n:var(--intermedio)"></i>INTERMEDIO</span>
    <span><i style="--n:var(--avanzado)"></i>AVANZADO</span>
    <span><i style="--n:var(--atp)"></i>A.T.P</span>
  </div>

  <footer class="sombra">
    <p><a id="ver-imagen" href="img/dias/viernes.jpg" target="_blank">Ver el cronograma de este día como imagen</a></p>
    <p class="estado" id="estado"></p>
  </footer>
</div>

<script>
// ===== Configuración =====
// La página lee las pestañas "Cronograma" y "Avisos" de esta Google Sheet cada minuto
// (tiene que estar compartida como "cualquiera con el enlace puede ver").
// Si no puede (sin internet, o sin compartir) usa lo último guardado o los datos de abajo.
const SHEET_ID = '1TewZcMW7hOO4xoBoEM9yTF8OFdMaG5m__1NG_OM9Nsw';

const DIAS = [
  {id:'Viernes', fecha:'2026-10-09', n:'9/10'},
  {id:'Sábado',  fecha:'2026-10-10', n:'10/10'},
  {id:'Domingo', fecha:'2026-10-11', n:'11/10'},
  {id:'Lunes',   fecha:'2026-10-12', n:'12/10'},
];

// Día | Desde | Hasta | Bloque | Actividad | Detalle | Profes | Nivel | Tipo
// Nivel: inicial / intermedio / avanzado / atp / general (color crema)
// Tipo: comida o gris (fila gris en cursiva) o vacío
// Las actividades con el mismo día, horario y Bloque van juntas en la misma fila.
const BASE = `
Viernes|15:00|||Llegada y check in|||general|
Viernes|17:00|||Bienvenida y acuerdos de convivencia||Equipo Festivalazo|general|
Viernes|18:00|20:00||Caer con dignidad, cuidar con actitud||Dan y Mati|atp|
Viernes|20:00|||Cena||||comida
Viernes|21:30|||Empieza el ritual|Fogón · Danza flow · Viaje sonoro||atp|
Sábado|09:00||Clases|Acro de piso||Mati|atp|
Sábado|09:00||Clases|Vertis||Nico|atp|
Sábado|09:00||Clases|Yoga||Simón|atp|
Sábado|10:00|||Desayuno||||comida
Sábado|11:20||Clases|Troupe e inversiones||Martu y Ari|inicial|
Sábado|11:20||Clases|Triples||Dan|intermedio|
Sábado|11:20||Clases|Flow con whips||Dina y Foco|intermedio|
Sábado|11:20||Clases|Whipcarian links||Gon y Ari|avanzado|
Sábado|13:30|||Almuerzo||||comida
Sábado|15:30||Clases|Fundamentos||Tavo, Dina y Fabri|inicial|
Sábado|15:30||Clases|Spicy flow||Oso y Ari|intermedio|
Sábado|15:30||Clases|Mano mano||Dan|intermedio|
Sábado|15:30||Clases|Icarianos XXL||Agus y Rober|avanzado|
Sábado|18:30||Clases|Masaje thai||Gonza|atp|
Sábado|18:30||Clases|Historias con el acro||César|atp|
Sábado|18:30||Clases|Percu corporal||Santi|atp|
Sábado|21:00|||Cena, varieté, fiesta||||comida
Domingo|10:00|||Desayuno||||comida
Domingo|11:00||Clases|El origen del flow||Oso y Ari|inicial|
Domingo|11:00||Clases|Hamacas||Martin|intermedio|
Domingo|11:00||Clases|Mano mano flow||Lu y Nacho|intermedio|
Domingo|11:00||Clases|Patas y piruetas||Sol y Fer|avanzado|
Domingo|13:30|||Foto grupal y sorpresa||||gris
Domingo|14:30|||Almuerzo y tiempo libre|¿Ya fuiste al bosque?|||comida
Domingo|17:30||Clases|Flow pie pie||Male y Mago|inicial|
Domingo|17:30||Clases|Banquinas||Martin|intermedio|
Domingo|17:30||Clases|Todo por el flow||Rober y Ari|intermedio|
Domingo|17:30||Clases|Icarianos||Agus y Gon|avanzado|
Domingo|17:30||Clases|Viaje sonoro y jam lunar|Si ya está para vos||atp|
Domingo|21:00|||Cena|Fanfarria Sostenida y Sindicato Imaginario|||comida
Lunes|09:00||Clases|Acro blandas||Mati|atp|
Lunes|09:00||Clases|Yoga y meditación||Simón|atp|
Lunes|10:00|||Desayuno||||comida
Lunes|11:20||Clases|Pass de flyer||Emma, Joaco y Cami|inicial|
Lunes|11:20||Clases|Whips passing||Rob y Sol|intermedio|
Lunes|11:20||Clases|Mano mano||Fer y José|intermedio|
Lunes|11:20||Clases|Whips returning||Gon y Agus|avanzado|
Lunes|13:30|||Cuerpo plastilina||Con las Aris|atp|
Lunes|14:00|||Almuerzo||||comida
Lunes|15:30|17:00||JAM y despedida interminable|||atp|
`.trim().split('\n').map(l => l.split('|'));

// ===== Utilidades =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s ?? '').trim();
const sinTildes = s => norm(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const params = new URLSearchParams(location.search);
// ?t=2026-10-10T16:30 permite probar cómo se ve en otro momento
const ahora = () => params.get('t') ? new Date(params.get('t') + ':00-03:00') : new Date();
const hhmm = s => { const m = norm(s).match(/^(\d{1,2})[:.]?(\d{2})?/); return m ? m[1].padStart(2,'0') + ':' + (m[2] || '00') : ''; };
const fecha = (dia, h) => new Date(`${dia.fecha}T${h}:00-03:00`);
const diaDe = nombre => DIAS.find(d => sinTildes(d.id) === sinTildes(nombre));
const TZ = 'America/Argentina/Buenos_Aires';
const hhmmDe = f => f.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: TZ });
const hoyStr = () => ahora().toLocaleDateString('en-CA', { timeZone: TZ });
const NIVELES = ['inicial', 'intermedio', 'avanzado', 'atp', 'general'];

function armar(filas) {
  const items = [];
  for (const f of filas) {
    const [dia, desde, hasta, bloque, actividad, detalle, profes, nivel, tipo] = f.map(norm);
    const d = diaDe(dia); const h = hhmm(desde);
    if (!d || !h) continue;
    const titulo = actividad || bloque;
    const tp = sinTildes(tipo);
    let nv = sinTildes(nivel).replace(/[^a-z]/g, '');
    if (!NIVELES.includes(nv)) nv = 'general';
    items.push({
      dia: d, desde: h, hasta: hhmm(hasta), bloque: actividad ? bloque : '',
      titulo, detalle, profes, nivel: nv,
      gris: tp === 'comida' || tp === 'gris' || /^(desayuno|almuerzo|cena|merienda)$/.test(sinTildes(titulo)),
    });
  }
  // fin implícito: el próximo horario de ese día, o 1,5 h después
  for (const it of items) it.ini = fecha(it.dia, it.desde);
  for (const it of items) {
    if (it.hasta) { it.fin = fecha(it.dia, it.hasta); continue; }
    const prox = items.filter(o => o.dia === it.dia && o.desde > it.desde).map(o => o.ini).sort((a, b) => a - b)[0];
    it.fin = prox || new Date(it.ini.getTime() + 90 * 60000);
  }
  return items.sort((a, b) => a.ini - b.ini);
}

// ===== Estado =====
let ITEMS = armar(BASE);
let AVISOS = [];
let diaSel = null;
let ultimaAct = null;

try {
  const g = JSON.parse(localStorage.getItem('crono2') || 'null');
  if (g && g.filas && g.filas.length) { ITEMS = armar(g.filas); AVISOS = g.avisos || []; ultimaAct = new Date(g.cuando); }
} catch (e) {}

// ===== Render =====
function grupos(lista) {
  // agrupa actividades que comparten día, horario y bloque (ej: clases paralelas)
  const out = [];
  for (const it of lista) {
    const k = it.dia.id + '|' + it.desde + '|' + it.hasta + '|' + it.bloque;
    const g = it.bloque && out.find(x => x.k === k);
    if (g) g.items.push(it); else out.push({ k, items: [it] });
  }
  return out;
}

const celda = it => `<div class="celda ${it.gris ? 'gris' : ''}" style="--n:var(--${it.nivel})">
  <div class="t">${esc(it.titulo)}</div>
  ${it.detalle ? `<div class="d">${esc(it.detalle)}</div>` : ''}
  ${it.profes ? `<div class="p">${esc(it.profes)}</div>` : ''}
</div>`;

function filaHTML(g, estado = '', horaExtra = '') {
  const a = g.items[0], n = g.items.length;
  const cols = n === 1 ? 1 : n === 3 ? 3 : 2;
  return `<div class="fila ${estado}">
    <div class="hora">${esc(a.desde)}${a.hasta ? `<small>a ${esc(a.hasta)}</small>` : ''}${horaExtra}</div>
    <div class="celdas" style="--cols:${cols}">${g.items.map(celda).join('')}</div>
  </div>`;
}

function renderDias() {
  const hoy = hoyStr();
  $('#dias').innerHTML = DIAS.map(d => `
    <button role="tab" aria-selected="${d === diaSel}" data-d="${d.id}">
      <b>${d.id.slice(0, 3).toUpperCase()}</b><span>${d.fecha === hoy ? '<span class="hoy">HOY</span>' : d.n}</span>
    </button>`).join('');
}

function renderDia() {
  const d = diaSel, t = ahora(), clave = sinTildes(d.id);
  document.documentElement.style.setProperty('--fondo', `url(img/dias/fondo-${clave}.jpg)`);
  $('#ver-imagen').href = `img/dias/${clave}.jpg`;
  const filas = grupos(ITEMS.filter(i => i.dia === d)).map(g => {
    const ini = g.items[0].ini, fin = Math.max(...g.items.map(i => i.fin));
    return filaHTML(g, t >= fin ? 'pasada' : t >= ini ? 'en-curso' : '');
  }).join('');
  $('#dia').innerHTML = `<div class="titulo-dia"><b>${d.id.toUpperCase()}</b><span class="sombra">${d.n}</span></div>
    <div class="tabla">${filas}</div>`;
}

function falta(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return `en ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  return `en ${h} h${r ? ' ' + r + ' min' : ''}`;
}

function renderAhora() {
  const t = ahora();
  const enCurso = ITEMS.filter(i => i.ini <= t && t < i.fin);
  const futuros = ITEMS.filter(i => i.ini > t);
  const proxIni = futuros[0]?.ini;
  const prox = futuros.filter(i => +i.ini === +proxIni);
  let html = '';

  if (!enCurso.length && !proxIni) {
    html = `<div class="mensaje"><div class="grande">¡Gracias por venir!</div><p>Nos vemos en la próxima edición.</p></div>`;
  } else if (!enCurso.length && t < ITEMS[0].ini) {
    const dias = Math.ceil((ITEMS[0].ini - t) / 86400000);
    html = `<div class="mensaje"><div class="grande">${dias > 1 ? `Faltan ${dias} días` : 'Arrancamos ' + falta(ITEMS[0].ini - t)}</div>
      <p>El Festivalazo empieza el viernes 9/10 a las ${esc(ITEMS[0].desde)}.</p></div>`;
  } else {
    if (enCurso.length) {
      const fin = new Date(Math.min(...enCurso.map(i => i.fin)));
      const ini = new Date(Math.max(...enCurso.map(i => i.ini)));
      const pct = Math.min(100, Math.max(0, (t - ini) / (fin - ini) * 100));
      html += `<div class="etq"><b><i class="punto"></i>AHORA</b><span>${hhmmDe(t)}</span></div>
        <div class="tabla">${grupos(enCurso).map(g => filaHTML(g)).join('')}</div>
        <div class="barra"><i style="width:${pct}%"></i></div><div class="queda">Termina ${falta(fin - t)} · ${hhmmDe(fin)}</div>`;
    }
    if (prox.length) {
      const mismoDia = prox[0].dia.fecha === hoyStr();
      html += `<div class="${enCurso.length ? 'bloque-sig' : ''}"><div class="etq"><b>A CONTINUACIÓN</b><span>${mismoDia ? '' : prox[0].dia.id + ' '}${esc(prox[0].desde)} · ${falta(prox[0].ini - t)}</span></div>
        <div class="tabla">${grupos(prox).map(g => filaHTML(g)).join('')}</div></div>`;
    }
  }
  $('#ahora').innerHTML = html;
}

function renderAvisos() {
  $('#avisos').innerHTML = AVISOS.map(a => `<div class="aviso"><span class="ico">📣</span><div>${esc(a.texto)}${a.hora ? `<small>${esc(a.hora)}</small>` : ''}</div></div>`).join('');
}

function renderEstado() {
  const off = !navigator.onLine;
  $('#estado').textContent = (off ? 'Sin conexión · ' : '') + (ultimaAct ? 'Actualizado ' + hhmmDe(ultimaAct) : '');
}

function render() {
  renderAvisos(); renderAhora(); renderDias(); renderDia(); renderEstado();
}

// ===== Datos en vivo (Google Sheet) =====
function csv(txt) {
  const filas = []; let f = [], v = '', q = false;
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"' && txt[i + 1] === '"') { v += '"'; i++; } else if (c === '"') q = false; else v += c; }
    else if (c === '"') q = true;
    else if (c === ',') { f.push(v); v = ''; }
    else if (c === '\n') { f.push(v); filas.push(f); f = []; v = ''; }
    else if (c !== '\r') v += c;
  }
  if (v || f.length) { f.push(v); filas.push(f); }
  return filas;
}
const hoja = n => fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(n)}&_=${Date.now()}`, { cache: 'no-store' })
  .then(r => r.ok ? r.text() : Promise.reject(r.status)).then(csv);

async function actualizar() {
  if (!SHEET_ID) return;
  try {
    const [cr, av] = await Promise.all([hoja('Cronograma'), hoja('Avisos').catch(() => [])]);
    const filas = cr.slice(1).filter(f => f.some(x => norm(x)));
    if (!filas.length) throw new Error('sin filas');
    ITEMS = armar(filas);
    AVISOS = av.slice(1).filter(f => norm(f[0])).map(f => ({ texto: norm(f[0]), hora: norm(f[1]) }));
    ultimaAct = new Date();
    try { localStorage.setItem('crono2', JSON.stringify({ filas, avisos: AVISOS, cuando: ultimaAct })); } catch (e) {}
  } catch (e) { console.warn('No se pudo actualizar', e); }
  render();
}

// ===== Arranque =====
diaSel = DIAS.find(d => d.fecha === hoyStr()) || (ahora() > fecha(DIAS[3], '23:59') ? DIAS[3] : DIAS[0]);
try { const g = sessionStorage.getItem('dia'); if (g && !params.get('t')) diaSel = diaDe(g) || diaSel; } catch (e) {}
$('#dias').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  diaSel = diaDe(b.dataset.d);
  try { sessionStorage.setItem('dia', diaSel.id); } catch (e) {}
  renderDias(); renderDia();
});
render();
actualizar();
setInterval(actualizar, 60000);
setInterval(() => { renderAhora(); renderDia(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) actualizar(); });
addEventListener('online', actualizar);
addEventListener('offline', renderEstado);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
